<div class="messages-container">
  <div class="header-actions">

    <button mat-raised-button color="primary" (click)="onCreate()">
      <mat-icon>add</mat-icon> Nuevo Mensaje
    </button>
  </div>

  <div class="messages-list" *ngIf="messages.length > 0; else noData">
    <mat-card *ngFor="let item of messages" class="message-card" [class.inactive]="!item.active">
      <mat-card-header>
        <mat-card-title>{{ item.title }}</mat-card-title>
        <mat-card-subtitle>
          Desde: {{ item.dateFrom | date:'dd/MM/yyyy HH:mm' }} | Hasta: {{ item.dateTo | date:'dd/MM/yyyy HH:mm' }}
          <span class="status-chip" [class.active-chip]="item.active" [class.inactive-chip]="!item.active">
            {{ item.active ? 'Activo' : 'Inactivo' }}
          </span>
        </mat-card-subtitle>
      </mat-card-header>

      <mat-card-content class="message-content">
        <p>{{ item.content }}</p>
      </mat-card-content>

      <mat-card-actions align="end">
        <button mat-button color="primary" (click)="onView(item)">
          <mat-icon>visibility</mat-icon> Ver
        </button>
        <button mat-button color="accent" (click)="onUpdate(item)">
          <mat-icon>edit</mat-icon> Editar
        </button>
        <button mat-button color="warn" (click)="onDelete(item)">
          <mat-icon>delete</mat-icon> Eliminar
        </button>
      </mat-card-actions>
    </mat-card>
  </div>

  <ng-template #noData>
    <div class="no-messages" *ngIf="!loading">
      <p>No hay mensajes para mostrar.</p>
    </div>
  </ng-template>
</div>
